packages:
  - apps/*
  - packages/*

# Prisma generates a type-safe client and esbuild compiles Next.js tooling during install.
# Keep this allowlist deliberately narrow; all other dependency build scripts remain blocked.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - unrs-resolver
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': set this to true or false
  esbuild: true
  prisma: true
  unrs-resolver: true
